name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          mkdir -p app/src/main/java app/src/main/res
          cp -r AndroidManifest.xml app/src/main/
          cp -r res/* app/src/main/res/ 2>/dev/null || true
          cp -r src/* app/src/main/java/ 2>/dev/null || true
          
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.tester.app'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.tester.app'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          
          gradle wrapper --gradle-version 7.5.1
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CyberReconSuite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
