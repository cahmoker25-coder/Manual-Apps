name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          mkdir -p app/src/main/java app/src/main/res
          cp -r AndroidManifest.xml app/src/main/ || true
          cp -r res/* app/src/main/res/ 2>/dev/null || true
          cp -r src/* app/src/main/java/ 2>/dev/null || true
          
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Buat struktur wrapper secara manual agar memaksa Gradle 8.1.1 tanpa download lewat CLI
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Download file gradlew secara langsung agar eksekusi murni pakai versi 8.1.1
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.1.1/gradlew > gradlew
          chmod +x gradlew
          
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CyberReconSuite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
