name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          mkdir -p app/src/main/java app/src/main/res
          cp -r AndroidManifest.xml app/src/main/ || true
          cp -r res/* app/src/main/res/ 2>/dev/null || true
          cp -r src/* app/src/main/java/ 2>/dev/null || true
          
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Hapus wrapper lama jika ada lalu buat ulang dari nol menggunakan versi 8.1.1
          rm -rf gradle gradlew gradlew.bat
          gradle wrapper --gradle-version 8.1.1
          
          # Eksekusi pakai gradlew lokal, dijamin tidak lari ke versi 9.6.1 lagi
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CyberReconSuite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
