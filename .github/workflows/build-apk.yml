name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: |
          mkdir -p app/src/main/java app/src/main/res
          cp -r AndroidManifest.xml app/src/main/
          cp -r res/* app/src/main/res/ 2>/dev/null || true
          cp -r src/* app/src/main/java/ 2>/dev/null || true
          
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle
          
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.tester.app'; compileSdk 34; defaultConfig { applicationId 'com.tester.app'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' } }" >> app/build.gradle
          
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CyberReconSuite-APK
          path: app/build/outputs/apk/debug/app-debug.apk
